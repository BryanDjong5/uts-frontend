<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapur Senja</title>
    <link rel="stylesheet" href="bookingForm.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Dapur Senja</div>
        <ul class="nav-links">
            <li><a href="/home/home.html">Home</a></li>
            <li><a href="/menu/menu.html">Menu</a></li>
            <li><a href="/promo/promotions.html" class="active">Promo & Info</a></li>
            <li><a href="../reservasi/reservasi.html">Reservation</a></li>
            <li><a href="/login.html">Account</a></li>
        </ul>
    </nav>
    <div class="booking">
    <div class="booking-input">
        <h1>Booking Form</h1>
        <input type="text" id="nama" placeholder="Masukkan nama anda">
        <input type="tel" id="noTelp" placeholder="Masukkan nomor telepon">
        <input type="email" id="email" placeholder="Masukkan email anda">
        <input type="date" id="tglBooking" placeholder="Masukkan tanggal pemesanan">
        <input type="time" id="jamBooking" placeholder="Masukkan jam pemesanan">
        <input type="number" id="jumOrang" placeholder="Masukkan jumlah orang">
        <label for="acara">Acara</label>
        <select id="acara">
            <option value="">-</option>
            <option value="ultah">Ulang tahun</option>
            <option value="aniv">Pernikahan</option>
            <option value="meeting">Meeting bisnis</option>
            <option value="lainnya">Lainnya</option>
        </select>
        <button type="submit" id="tombol_booking">Booking</button>
        <div id="hasilValidasi"></div>
    </div>
</div>
<script src="bookingForm.js"></script>
</body>
</html>
