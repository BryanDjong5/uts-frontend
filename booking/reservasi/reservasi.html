<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reservasi.css">
    <title>Reservasi</title>
</head>
<body>
    <img src="../img/jam.png">
    <div class="gambar-meja">
        <img src="../img/meja_reservasi.png">
    </div>
    <div class="gambar-antri">
        <img src="../img/orang2.png">
    </div>
    <div class="gambar-price">
        <img src="../img/price.png">
    </div>
    <div class="reservasi">
        <h1>Form Reservasi</h1>
    <div class="input-reservasi">
        <input type="text" id="penjelasan-reservasi" placeholder="Masukkan tujuan reservasi">
        <input type="date" id="tgl-reservasi" placeholder="Masukkan tanggal reservasi">
        <input type="time" id="jam-reservasi" placeholder="Masukkan jam reservasi">
        <input type="number" id="jum-pelanggan" placeholder="Masukkan jumlah orang">
        <button type="submit" id="tombol-booking">Booking</button>
        <p id="pesan-status"></p>
    </div>
    </div>
    <script src="reservasi.js"></script>
</body>
</html>
