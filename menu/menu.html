<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">RestaurantKu</div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="menu.html" class="active">Menu</a></li>
            <li><a href="../booking/reservation.html">Reservation</a></li>
            <li><a href="../login.html">Account</a></li>
        </ul>
    </nav>

    <header class="menu-header">
        <h1>Menu Spesial Kami</h1>
        <p>Jelajahi hidangan terbaik dari koki kami</p>
    </header>

    <div class="filter-container">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="appetizer">Appetizer</button>
        <button class="filter-btn" data-category="main-course">Main Course</button>
        <button class="filter-btn" data-category="dessert">Dessert</button>
        <button class="filter-btn" data-category="drinks">Drinks</button>
    </div>

    <main class="menu-container" id="menu-container">
        <div class="menu-card">
            <img src="images/nasigoreng.jpg" alt="Nasi Goreng Spesial">
            <div class="menu-info">
                <h3>Nasi Goreng Spesial</h3>
                <p class="price">Rp 45.000</p>
                <p class="rating">⭐ 4.8</p>
            </div>
        </div>
        <div class="menu-card">
            <img src="images/ayambakar.jpg" alt="Ayam Bakar Madu">
            <div class="menu-info">
                <h3>Ayam Bakar Madu</h3>
                <p class="price">Rp 55.000</p>
                <p class="rating">⭐ 4.9</p>
            </div>
        </div>
    </main>

    <script src="menu.js"></script>
</body>
</html>
